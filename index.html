<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>從光子到影像｜互動學習心智圖</title><style>
:root{--bg:#f5f6f8;--paper:#fff;--ink:#203044;--muted:#68798a;--line:#dce3e9;--blue:#416e91;--pale:#eaf1f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,'Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;color:var(--ink)}header{background:white;border-bottom:1px solid var(--line);padding:17px 28px;display:flex;align-items:center;justify-content:space-between;gap:15px}h1{font-size:19px;margin:0}small,.muted{color:var(--muted)}.wrap{display:grid;grid-template-columns:minmax(300px,1.3fr) minmax(320px,1fr);gap:16px;padding:16px;max-width:1600px;margin:auto}.panel{background:var(--paper);border:1px solid var(--line);border-radius:15px;overflow:hidden}.ph{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.ph h2{margin:0;font-size:16px}.mind{padding:20px;height:690px;overflow:auto}.root{display:inline-block;background:var(--ink);color:white;border-radius:12px;padding:15px 20px;font-weight:700;margin:0 0 20px}.branch{margin-left:13px;padding:0 0 0 19px;border-left:2px solid #cbd8e2}.branch-head,.leaf{display:block;text-align:left;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:11px 13px;margin:7px 0;cursor:pointer;font-size:14px;width:min(100%,560px)}.branch-head{background:var(--pale);font-weight:700}.branch-head:hover,.leaf:hover,.selected{border-color:#658aa7;background:#f0f5fa}.leaf{margin-left:15px;width:calc(100% - 15px)}.sub{padding-left:18px;border-left:1px solid #e0e6ec;margin-left:10px}.detail{padding:24px;min-height:350px}.detail h2{margin:0 0 8px;font-size:23px}.tag{display:inline-block;background:var(--pale);border-radius:8px;padding:5px 10px;color:#456c88;font-size:12px;margin-bottom:14px}.detail p{line-height:1.85}.detail ul{line-height:1.9;padding-left:21px}.term{border-top:1px solid var(--line);margin-top:20px;padding-top:16px;font-size:14px}.sim{grid-column:1/-1}.tabs{display:flex;gap:4px;padding:12px;overflow-x:auto;border-bottom:1px solid var(--line)}button{cursor:pointer;font-family:inherit}button.tab{border:0;border-radius:8px;background:transparent;padding:10px 16px;white-space:nowrap;color:var(--muted)}button.tab.active{background:var(--pale);color:var(--ink);font-weight:700}.sim-body{padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:30px;min-height:265px}.control label{display:block;font-size:14px;margin-bottom:12px}.control input[type=range]{width:100%;accent-color:#416e91}.readout{font-size:30px;font-weight:700;margin:12px 0}.bits{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin-top:18px}.bit{border:1px solid #d4dee7;border-radius:7px;min-height:55px;text-align:center;padding:7px 2px;background:#f5f7f9}.bit.on{background:#d7e8f5;border-color:#6b9abf}.bit b{font-size:20px}.bit small{display:block;font-size:10px}.explain{font-size:14px;line-height:1.8;color:var(--muted)}.action{border:1px solid #bdd0df;border-radius:8px;background:#eaf1f7;padding:8px 12px;margin:8px 8px 8px 0;color:var(--ink)}.stage{border:1px solid #dce3e9;background:#fafbfc;border-radius:12px;padding:16px;margin-bottom:12px}.bar{height:16px;background:#e0e8ee;border-radius:20px;overflow:hidden;margin:16px 0}.bar div{height:100%;background:#6e9fc1}.cells{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}.cell{height:58px;border:1px solid #cbd8e2;border-radius:7px;display:grid;place-items:center;background:#eef1f4}.cell.charged{background:#dbeaf5;border-color:#6e9fc1}.cell .dots{font-size:13px;color:#447eaa}.foot{padding:15px 25px;color:var(--muted);font-size:12px;text-align:center}@media(max-width:850px){.wrap{grid-template-columns:1fr}.sim-body{grid-template-columns:1fr}.mind{height:490px}header{padding:15px}}
</style></head><body><header><div><h1>從光子到影像｜互動學習心智圖</h1><small>波段・像素・ADC・DN・二進位・物理儲存</small></div><small>自學版 · 五層架構</small></header><main class="wrap"><section class="panel"><div class="ph"><h2>知識心智圖</h2><small>點選問題查看白話解釋</small></div><div class="mind"><div class="root">影像如何形成、變成數字並被儲存？</div><div id="tree"></div></div></section><section class="panel"><div class="ph"><h2>學習說明</h2><small>點選左側節點</small></div><article id="detail" class="detail"></article></section><section class="panel sim"><div class="ph"><h2>互動操作實驗室</h2><small>操作數字，觀察實際流程</small></div><div class="tabs" id="tabs"></div><div class="sim-body"><div id="controls"></div><div id="results"></div></div></section></main><div class="foot">教學說明：所有電壓、量化、電荷與記憶單元的數字均為理想化模型；實際感測器、ADC、DRAM、NAND Flash 的設計可能不同。</div><script>
const topics=[{name:'01｜光與波段',items:[['波段是什麼？','波長是連續的；波段是感測器選定的一段波長範圍。','不要把一個波段誤解為一個固定波長。',['光譜可以隨波長連續變化','感測器把波段內訊號依響應加權整合','單一波段值無法還原區間內完整光譜'],'波長、光譜、光譜響應函數 SRF'],['Blue = 80 是什麼？','可能是藍光通道經數位化後的 DN = 80，不是 80 nm，也不代表光偏向某個波長。','同一個數字可能來自不同的波段內光譜分布。',['要知道物理亮度需校正參數','DN 並非反射率','一張灰階圖可顯示某波段各像素的大小'],'DN、輻亮度、反射率'],['傳統黑白照片是什麼？','傳統黑白底片通常對一定範圍的可見光感光；掃描後能成為數位灰階影像。','黑白顯示不等於紅外線。',['灰階是呈現方法','單波段可呈現為灰階','RGB 合成的亮度也可呈現為灰階'],'灰階、單色影像']]},{name:'02｜像素與 RGB',items:[['RGB 為何有三個通道？','紅、綠、藍各有一組像素數值；RGB 彩色影像由三個通道共同表達顏色。','一般 RGB 感測器常以彩色濾光片讓感光位置接收偏向某段波長的光。',['單通道是二維矩陣','RGB 是三組數值','Bayer 相機常需去馬賽克'],'RGB、Bayer、Channel'],['亮度公式哪裡來？','Rec.709 指定三原色色度座標與 D65 白點，利用 CIE XYZ 轉換可推導線性 RGB 亮度權重。','Y = 0.2126R + 0.7152G + 0.0722B；不要把它誤當所有影像的唯一亮度公式。',['色彩標準指定原色','亮度權重是數學推導結果','編碼後的 Y′ 不等於物理 Y'],'Rec.709、XYZ、Luminance、Luma'],['衛星如何儲存不同波段？','同一地點在 Red、Green、Blue、NIR 可分別記錄數值；檔案可以分波段或多波段儲存。','顯示時可以把指定波段映射到螢幕 R/G/B。',['單波段可灰階顯示','多波段可組真彩色或假色彩','NDVI 使用 Red 與 NIR'],'Multispectral、NIR、NDVI']]},{name:'03｜感光與 ADC',items:[['光怎麼變成電？','光子被感光半導體吸收後產生可收集電荷，曝光期間累積，經讀取電路形成電訊號。','感光元件暫時累積電荷，不等於直接把那批電子送到 SD 卡。',['光電轉換','電荷讀取','電壓與電荷不是同一單位'],'CMOS、Photon、Electron'],['ADC 是什麼？','類比數位轉換器，把連續電訊號量化成有限個數位等級。','8-bit ADC 可輸出 256 種編碼，並非表示有 8 個感光元件。',['SAR ADC 常以比較器重複測試','Flash ADC 使用大量並列比較器','不同 ADC 架構不同'],'ADC、Comparator、SAR、DAC'],['DN 和 8-bit 的關係？','DN 是數位計數值；8-bit 是表示此數值的位元深度。','DN 80 在 8-bit 無號表示是 01010000。',['DN 通常是整數','0～255 是 8-bit 無號可表示的範圍','DN 可能經後處理、並非永遠是原始 ADC 輸出'],'DN、量化、位元深度']]},{name:'04｜二進位',items:[['bit 是真實物件嗎？','bit 是資訊單位，實體晶片透過不同電氣狀態表示 bit。','數字 0/1 是解讀符號，不是電子變成字形。',['單一 bit 可表示兩種狀態','8 bit 是 1 byte','0/1 需要物理儲存單元'],'bit、byte、電晶體'],['01010000 如何是 80？','二進位每個位置的權重依序為 128、64、32、16、8、4、2、1。','01010000 只有 64 和 16 兩位為 1，因此代表 80。',['權重來自位置','儲存單元本身不知道權重','數位電路按預先定義的排列解讀'],'二進位、最高有效位元'],['為何不用十進位直接儲存？','電子電路容易可靠區分兩種狀態，降低對小電壓差的敏感度。','同樣數值可以用十進位顯示，底層仍可由 bit 儲存。',['二元判斷有容錯空間','數位化有量化誤差','數位複製可重建可辨識狀態'],'Binary、Noise Margin']]},{name:'05｜實體記憶體',items:[['資料存在哪？','相機影像可先暫存在 RAM，再將編碼檔案存到 SD 卡的 Flash 記憶體。','位址是邏輯定位方式，不等於照片在卡上排成實體像素網格。',['RAM 通常斷電失去資料','Flash 斷電可保留','記憶體控制器管理儲存位置'],'DRAM、NAND Flash、Address'],['一個記憶單元就是 0 或 1？','SLC Flash 一單元存 1 bit；MLC/TLC 等可用多個臨界電壓範圍存多 bit。','8-bit 資料不必固定佔 8 個 NAND 物理單元。',['電荷改變臨界電壓','讀取電路判斷儲存狀態','實際 0/1 對應依技術而異'],'SLC、MLC、TLC、Threshold Voltage'],['為何不直接儲存電壓？','類比儲存可行，但細小差異容易受漏電與雜訊影響；數位狀態較容易可靠讀取。','數位化仍有量化誤差，並非毫無資訊損失。',['類比狀態會漂移','數位狀態可分界判斷','記憶體也可能出錯'],'Analog Storage、Quantization Error']]}];
let chosen=[0,0];function show(a,b){chosen=[a,b];let t=topics[a].items[b];document.querySelector('#detail').innerHTML=`<span class="tag">第 2 層：${topics[a].name}</span><h2>${t[0]}</h2><p><strong>一句話先懂：</strong>${t[1]}</p><p><strong>白話記憶：</strong>${t[2]}</p><h3>學習目標</h3><ol>${t[3].map(x=>`<li>${x}</li>`).join('')}</ol><div class="term"><strong>專有名詞：</strong>${t[4]}</div>`;renderTree()}function renderTree(){document.querySelector('#tree').innerHTML=topics.map((t,a)=>`<div class="branch"><button class="branch-head" data-a="${a}">${t.name}　⌄</button><div class="sub" id="sub${a}">${t.items.map((x,b)=>`<button class="leaf ${chosen[0]===a&&chosen[1]===b?'selected':''}" data-a="${a}" data-b="${b}">${b+1}. ${x[0]}</button>`).join('')}</div></div>`).join('');document.querySelectorAll('.leaf').forEach(x=>x.onclick=()=>show(+x.dataset.a,+x.dataset.b));document.querySelectorAll('.branch-head').forEach(x=>x.onclick=()=>{let el=document.querySelector('#sub'+x.dataset.a);el.hidden=!el.hidden})}show(0,0);
const tabs=['波段整合','電壓 → DN','DN → 8 bit','實體儲存','RGB → 亮度'];let tab=0,voltage=.314,dn=80,sarStep=0,rgb=[100,150,200],strength=[12,25,40,20,8];const weights=[128,64,32,16,8,4,2,1];const bin=n=>n.toString(2).padStart(8,'0');function setTab(i){tab=i;draw()};function draw(){document.querySelector('#tabs').innerHTML=tabs.map((x,i)=>`<button class="tab ${i===tab?'active':''}" data-t="${i}">${x}</button>`).join('');document.querySelectorAll('.tab').forEach(el=>el.onclick=()=>setTab(+el.dataset.t));const controls=document.querySelector('#controls'),results=document.querySelector('#results');if(tab===0){controls.innerHTML='<h3>一個藍光波段內，有很多波長</h3><p class="explain">假設光譜響應權重依序是 0.2、0.5、1、0.7、0.1。調整各個窄區間的入射訊號。</p>'+[455,465,475,485,495].map((w,i)=>`<label>${w} nm：<b>${strength[i]}</b><input data-s="${i}" type="range" min="0" max="100" value="${strength[i]}"></label>`).join('');let v=strength.reduce((s,x,i)=>s+x*[.2,.5,1,.7,.1][i],0)/2.5;results.innerHTML=`<div class="stage"><small>響應加權平均（教學示意）</small><div class="readout">${v.toFixed(1)}</div><p class="explain">不同的光譜分布可以形成相同的整合結果。這不是實際 ADC 的 DN，也不能反推出每個波長的光強度。</p></div>`;controls.querySelectorAll('input').forEach(el=>el.oninput=e=>{strength[+el.dataset.s]=+e.target.value;draw()})}if(tab===1){dn=Math.min(255,Math.floor(voltage*256));controls.innerHTML=`<h3>8-bit SAR ADC（理想模型）</h3><label>輸入電壓：${voltage.toFixed(4)} V<input type="range" id="v" min="0" max="1" step="0.0001" value="${voltage}"></label><div class="stage">量測範圍 0～1 V<br>量化間距 1/256 = 0.00390625 V</div><button class="action" id="prev">上一步</button><button class="action" id="next">下一步</button><button class="action" id="reset">重設步驟</button>`;let prefix=0,trial=0;for(let i=0;i<Math.min(sarStep,8);i++){let test=prefix+weights[i];if(voltage>=test/256)prefix=test}if(sarStep<8)trial=prefix+weights[sarStep];results.innerHTML=`<div class="stage"><small>目前已確認 ${sarStep} / 8 個位元</small><div class="readout">${sarStep===8?bin(dn):bin(prefix).slice(0,sarStep)+'?'.repeat(8-sarStep)}</div>${sarStep<8?`<p>下一次比較：輸入 ${voltage.toFixed(4)} V 與 DAC 參考 ${(trial/256).toFixed(6)} V</p><p>${voltage>=trial/256?'輸入較高 → 此 bit = 1':'輸入較低 → 此 bit = 0'}</p>`:'<p>8 次比較完成</p>'}</div><p class="explain">ADC 輸出 DN = <b>${dn}</b>，以 8-bit 表示是 <b>${bin(dn)}</b>。DN 與二進位碼是同一個數位結果的兩種表示。</p>`;controls.querySelector('#v').oninput=e=>{voltage=+e.target.value;sarStep=0;draw()};controls.querySelector('#prev').onclick=()=>{sarStep=Math.max(0,sarStep-1);draw()};controls.querySelector('#next').onclick=()=>{sarStep=Math.min(8,sarStep+1);draw()};controls.querySelector('#reset').onclick=()=>{sarStep=0;draw()}}if(tab===2){controls.innerHTML=`<h3>像素 DN = ${dn}</h3><label>調整數值（0～255）<input id="dn" type="range" min="0" max="255" value="${dn}"></label><p class="explain">每個 bit 的位置權重固定，但儲存單元本身並不知道 128、64 等數學意義。</p>`;results.innerHTML=`<div class="stage"><small>8 個儲存位置 / 位元權重</small><div class="bits">${weights.map((w,i)=>`<div class="bit ${bin(dn)[i]==='1'?'on':''}"><small>${w}</small><b>${bin(dn)[i]}</b></div>`).join('')}</div><div class="readout">${bin(dn)}</div><p>${weights.filter((w,i)=>bin(dn)[i]==='1').join(' + ')||'0'} = ${dn}</p></div>`;controls.querySelector('#dn').oninput=e=>{dn=+e.target.value;draw()}}if(tab===3){controls.innerHTML=`<h3>一個像素的數位資料如何保存？</h3><label>像素 DN：${dn}<input id="memdn" type="range" min="0" max="255" value="${dn}"></label><div class="stage"><b>範例：SLC Flash 的 8 個儲存單元</b><p class="explain">單元以不同電荷／臨界電壓狀態表示 bit。藍色為邏輯 1，灰色為邏輯 0；實際編碼可能相反。</p></div>`;results.innerHTML=`<div class="stage"><small>示意存放於一個 byte 的 8 個 bit</small><div class="cells">${bin(dn).split('').map(b=>`<div class="cell ${b==='1'?'charged':''}"><div><div class="dots">${b==='1'?'● ●':'○ ○'}</div><b>${b}</b></div></div>`).join('')}</div><div class="readout">${bin(dn)}</div></div><p class="explain">電子本身沒有變成文字 0/1。記憶體控制器施加電壓，讓物理儲存單元呈現可區分的狀態；讀取電路再把狀態判讀成 bit。實際檔案可經壓縮，並不一定讓每個像素固定佔 8 個 SLC 單元。</p>`;controls.querySelector('#memdn').oninput=e=>{dn=+e.target.value;draw()}}if(tab===4){controls.innerHTML='<h3>從 RGB 得到亮度訊號</h3>'+['R','G','B'].map((w,i)=>`<label>${w}：${rgb[i]}<input type="range" data-c="${i}" min="0" max="255" value="${rgb[i]}"></label>`).join('');let y=Math.round(.2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2]);results.innerHTML=`<div class="stage"><small>RGB 輸入</small><div style="height:65px;border-radius:8px;background:rgb(${rgb})"></div><small>Rec.709 luma 近似（對 R′G′B′ 直接加權）</small><div class="readout">Y′ ≈ ${y}</div><div style="height:65px;border-radius:8px;background:rgb(${y},${y},${y})"></div></div><p class="explain">線性 RGB 的相同權重用於相對光亮度 Y；編碼後 RGB 加權得到的是亮度訊號 Y′，不是經物理校正的輻亮度。</p>`;controls.querySelectorAll('input').forEach(el=>el.oninput=e=>{rgb[+el.dataset.c]=+e.target.value;draw()})}}draw();
</script></body></html>
